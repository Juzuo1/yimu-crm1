# IMAP 邮件同步 Worker（备选路径：Edge Function 不可用时切换到此方案）
# 每 15 分钟运行一次：读取各邮箱账号 → 增量拉取新邮件 → 调 ingest_emails RPC 入库
name: IMAP Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/imap-sync/package-lock.json

      - name: 安装 Worker 依赖
        working-directory: workers/imap-sync
        run: npm ci || npm install

      - name: 运行同步
        working-directory: workers/imap-sync
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node index.js
